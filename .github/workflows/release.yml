# Builds the downloadable Robot Lab when the teacher pushes a version tag (for example v1.0.0),
# and attaches RobotLab-windows.zip (and its SHA-256 checksum) to that release.
# Needs the repository variable ROBOTLAB_SERVER = wss://play.<club domain>
# (Settings > Secrets and variables > Actions > Variables).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # to create the release and upload the zip; nothing else

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3
      - name: Safety checks (logins, brain sandbox, codes)
        run: python security_test.py
      - name: Build
        env:
          ROBOTLAB_SERVER: ${{ vars.ROBOTLAB_SERVER }}
        run: python release/build_windows.py --tag "${{ github.ref_name }}"
      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist/RobotLab-windows.zip -Algorithm SHA256).Hash + "  RobotLab-windows.zip" | Out-File -Encoding ascii dist/RobotLab-windows.zip.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/RobotLab-windows.zip dist/RobotLab-windows.zip.sha256 --title "Robot Lab ${{ github.ref_name }}" --generate-notes
