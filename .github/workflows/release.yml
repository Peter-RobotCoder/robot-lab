# Builds the downloadable Club Coders app (both games) when the teacher pushes a version tag (for example
# v1.1.0, matching the VERSION file), and attaches ClubCoders-windows.zip (and its SHA-256 checksum) to that release.
# Needs the repository variable ROBOTLAB_SERVER = wss://play.<club domain>
# (Settings > Secrets and variables > Actions > Variables).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # to create the release and upload the zip; nothing else

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r games/robotlab/requirements.txt -r games/fightlab/requirements.txt pyinstaller==6.22.3 cryptography==46.0.2
      - name: Safety checks, Robot Lab (logins, brain sandbox, codes)
        working-directory: games/robotlab
        run: python security_test.py
      - name: Safety checks, Fight Lab
        working-directory: games/fightlab
        run: python security_test.py
      - name: Build
        env:
          ROBOTLAB_SERVER: ${{ vars.ROBOTLAB_SERVER }}
        run: python release/build_windows.py --tag "${{ github.ref_name }}"
      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist/ClubCoders-windows.zip -Algorithm SHA256).Hash + "  ClubCoders-windows.zip" | Out-File -Encoding ascii dist/ClubCoders-windows.zip.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/ClubCoders-windows.zip dist/ClubCoders-windows.zip.sha256 --title "Club Coders ${{ github.ref_name }}" --generate-notes
